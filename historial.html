<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BodyTrack - Historial</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="d-flex flex-column align-items-center py-5">

  <div class="card shadow p-4" style="width: 100%; max-width: 800px;">
    <h2 class="text-center mb-4">Historial de Ejercicios</h2>

    <div class="row g-4">
      <!-- Ejercicio 1 -->
      <div class="col-md-4">
        <div class="card h-100 border-primary">
          <div class="card-body">
            <h5 class="card-title text-primary">Sentadillas con barra</h5>
            <p class="card-text mb-1"><strong>Repeticiones:</strong> 4x10</p>
            <p class="card-text mb-1"><strong>Peso:</strong> 60 kg</p>
            <p class="card-text text-muted"><small>Fecha: 25 de abril de 2025</small></p>
          </div>
        </div>
      </div>

      <!-- Ejercicio 2 -->
      <div class="col-md-4">
        <div class="card h-100 border-primary">
          <div class="card-body">
            <h5 class="card-title text-success">Press de banca</h5>
            <p class="card-text mb-1"><strong>Repeticiones:</strong> 4x8</p>
            <p class="card-text mb-1"><strong>Peso:</strong> 50 kg</p>
            <p class="card-text text-muted"><small>Fecha: 23 de abril de 2025</small></p>
          </div>
        </div>
      </div>

      <!-- Ejercicio 3 -->
      <div class="col-md-4">
        <div class="card h-100 border-primary">
          <div class="card-body">
            <h5 class="card-title text-danger">Dominadas</h5>
            <p class="card-text mb-1"><strong>Repeticiones:</strong> 3xMáximo</p>
            <p class="card-text mb-1"><strong>Asistencia:</strong> Ninguna</p>
            <p class="card-text text-muted"><small>Fecha: 21 de abril de 2025</small></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
