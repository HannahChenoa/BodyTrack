<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BodyTrack - Rutinas</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      max-width: 900px;
      margin: 2rem auto;
    }
  </style>
</head>

<body>

  <!-- Botón para volver al Home -->
  <div class="mb-4 text-center">
    <a href="home.html" class="btn btn-secondary">← Volver al Inicio</a>
  </div>

  <!-- Botones para seleccionar zonas -->
  <div class="d-flex flex-wrap justify-content-center gap-3 mb-4">
    <button type="button" class="btn btn-primary" onclick="mostrarSeccion('hombros')">Hombros</button>
    <button type="button" class="btn btn-primary" onclick="mostrarSeccion('pecho')">Pecho</button>
    <button type="button" class="btn btn-primary" onclick="mostrarSeccion('espalda')">Espalda</button>
    <button type="button" class="btn btn-primary" onclick="mostrarSeccion('brazos')">Brazos</button>
    <button type="button" class="btn btn-primary" onclick="mostrarSeccion('piernas')">Piernas</button>
    <button type="button" class="btn btn-primary" onclick="mostrarSeccion('abdomen')">Abdomen</button>
    <button type="button" class="btn btn-primary" onclick="mostrarSeccion('gluteos')">Glúteos</button>
    <button type="button" class="btn btn-primary" onclick="mostrarSeccion('pantorrillas')">Pantorrillas</button>
  </div>

  <!-- Rutina personalizada -->
  <div class="card shadow p-4 mt-4">
    <h4>Rutina personalizada</h4>
    <div class="mb-3">
      <label for="nombreRutina" class="form-label">Nombre de la rutina</label>
      <input type="text" id="nombreRutina" class="form-control" placeholder="Ej: Rutina de espalda y brazos">
    </div>
    <ul id="rutinaSeleccionada" class="list-group mb-3"></ul>
    <div class="d-grid">
      <button class="btn btn-success" onclick="guardarRutina()">Guardar rutina en historial</button>
    </div>
  </div>

  <!-- Secciones dinámicas vacías -->
  <div class="card shadow p-4 seccion" id="hombros" style="display:none;"><h2 class="text-center mb-4">Hombros</h2><div class="list-group"></div></div>
  <div class="card shadow p-4 seccion" id="pecho" style="display:none;"><h2 class="text-center mb-4">Pecho</h2><div class="list-group"></div></div>
  <div class="card shadow p-4 seccion" id="espalda" style="display:none;"><h2 class="text-center mb-4">Espalda</h2><div class="list-group"></div></div>
  <div class="card shadow p-4 seccion" id="brazos" style="display:none;"><h2 class="text-center mb-4">Brazos</h2><div class="list-group"></div></div>
  <div class="card shadow p-4 seccion" id="piernas" style="display:none;"><h2 class="text-center mb-4">Piernas</h2><div class="list-group"></div></div>
  <div class="card shadow p-4 seccion" id="abdomen" style="display:none;"><h2 class="text-center mb-4">Abdomen</h2><div class="list-group"></div></div>
  <div class="card shadow p-4 seccion" id="gluteos" style="display:none;"><h2 class="text-center mb-4">Glúteos</h2><div class="list-group"></div></div>
  <div class="card shadow p-4 seccion" id="pantorrillas" style="display:none;"><h2 class="text-center mb-4">Pantorrillas</h2><div class="list-group"></div></div>

  <!-- Scripts -->
  <script>
    let rutina = [];

    function mostrarSeccion(id) {
      document.querySelectorAll('.seccion').forEach(sec => sec.style.display = 'none');
      const seccion = document.getElementById(id.toLowerCase());
      if (seccion) {
        seccion.style.display = 'block';
      }
    }

    function agregarEjercicio(nombre) {
      const repeticiones = prompt(`¿Cuántas repeticiones para "${nombre}"?`);
      if (!repeticiones) return;

      const peso = prompt(`¿Qué peso usarás para "${nombre}"?`);
      if (!peso) return;

      rutina.push({ nombre, repeticiones, peso });

      const lista = document.getElementById('rutinaSeleccionada');
      const item = document.createElement('li');
      item.className = 'list-group-item';
      item.innerText = `${nombre} - ${repeticiones} - ${peso}`;
      lista.appendChild(item);
    }

    async function guardarRutina() {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) {
        alert('Debes iniciar sesión');
        return;
      }
      const nombreRutina = document.getElementById('nombreRutina').value.trim();

      if (!nombreRutina || rutina.length === 0) {
        alert('Completa los datos de la rutina');
        return;
      }

      const nuevaRutina = {
        userId: user.id,
        nombreRutina,
        fecha: new Date().toISOString().split('T')[0],
        ejercicios: rutina
      };

      try {
        const res = await fetch('/api/history', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(nuevaRutina)
        });

        const data = await res.json();
        if (res.ok) {
          alert('✅ Rutina guardada');
          window.location.href = 'historial.html';
        } else {
          alert('❌ Error: ' + data.message);
        }
      } catch (err) {
        console.error(err);
        alert('Error al guardar la rutina');
      }
    }

    async function cargarEjercicios() {
      const res = await fetch('/api/ejercicios');
      const ejercicios = await res.json();

      const secciones = {
        'Pecho': 'pecho',
        'Espalda': 'espalda',
        'Hombros': 'hombros',
        'Piernas': 'piernas',
        'Brazos': 'brazos',
        'Abdomen': 'abdomen',
        'Glúteos': 'gluteos',
        'Pantorrillas': 'pantorrillas'
      };

      ejercicios.forEach(ej => {
        const seccionId = secciones[ej.musculo];
        if (!seccionId) return;

        const seccion = document.getElementById(seccionId);
        const contenedor = seccion.querySelector('.list-group');

        const div = document.createElement('div');
        div.className = 'list-group-item';
        div.innerHTML = `
          <h5>${ej.nombre}</h5>
          <p>${ej.descripcion}</p>
          <small>Músculo: ${ej.musculo}</small><br>
          <a href="${ej.link}" target="_blank">Ver video</a><br>
          <button class="btn btn-sm btn-outline-primary mt-2"
            onclick="agregarEjercicio('${ej.nombre}')">
            Agregar a rutina
          </button>
        `;
        contenedor.appendChild(div);
      });
    }

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const zona = params.get('zona');
      if (zona) mostrarSeccion(zona.toLowerCase());
      cargarEjercicios();
    };
  </script>

</body>
</html>
