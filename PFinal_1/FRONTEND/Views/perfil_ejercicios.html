<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BodyTrack - Administrador</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 700px;
    }
  </style>

  <script>
    let ejercicios = [];

    function agregarEjercicio() {
      const nombre = document.getElementById('nombreEjercicio').value.trim();
      const musculo = document.getElementById('musculoTrabajo').value.trim();
      const descripcion = document.getElementById('descripcionEjercicio').value.trim();

      if (!nombre || !musculo || !descripcion) {
        alert('Por favor completa todos los campos.');
        return;
      }

      const nuevoEjercicio = { nombre, musculo, descripcion };
      ejercicios.push(nuevoEjercicio);
      actualizarLista();

      document.getElementById('nombreEjercicio').value = '';
      document.getElementById('musculoTrabajo').value = '';
      document.getElementById('descripcionEjercicio').value = '';
    }

    function actualizarLista() {
      const lista = document.getElementById('listaEjercicios');
      lista.innerHTML = '';

      ejercicios.forEach((ejercicio, index) => {
        const item = document.createElement('li');
        item.className = 'list-group-item d-flex justify-content-between align-items-start';
        item.innerHTML = `
          <div class="ms-2 me-auto">
            <div class="fw-bold">${ejercicio.nombre}</div>
            <small>Músculo: ${ejercicio.musculo}</small><br>
            <small>${ejercicio.descripcion}</small>
          </div>
          <div>
            <button class="btn btn-sm btn-warning me-2" onclick="editarEjercicio(${index})">Editar</button>
            <button class="btn btn-sm btn-danger" onclick="eliminarEjercicio(${index})">Eliminar</button>
          </div>
        `;
        lista.appendChild(item);
      });
    }

    function eliminarEjercicio(index) {
      if (confirm('¿Estás seguro de eliminar este ejercicio?')) {
        ejercicios.splice(index, 1);
        actualizarLista();
      }
    }

    function editarEjercicio(index) {
      const ejercicio = ejercicios[index];
      const nuevoNombre = prompt('Editar nombre:', ejercicio.nombre);
      const nuevoMusculo = prompt('Editar músculo trabajado:', ejercicio.musculo);
      const nuevaDescripcion = prompt('Editar descripción:', ejercicio.descripcion);

      if (nuevoNombre && nuevoMusculo && nuevaDescripcion) {
        ejercicios[index] = {
          nombre: nuevoNombre.trim(),
          musculo: nuevoMusculo.trim(),
          descripcion: nuevaDescripcion.trim()
        };
        actualizarLista();
      } else {
        alert('No se puede dejar campos vacíos.');
      }
    }
  </script>

</head>

<body class="d-flex justify-content-center align-items-center p-4">

  <div class="card shadow p-4">
    <h2 class="text-center mb-4">Panel de Administrador</h2>

    <h5 class="mb-3">Agregar nuevo ejercicio</h5>

    <div class="mb-3">
      <label for="nombreEjercicio" class="form-label">Nombre del ejercicio</label>
      <input type="text" id="nombreEjercicio" class="form-control" placeholder="Ej: Sentadillas">
    </div>

    <div class="mb-3">
      <label for="musculoTrabajo" class="form-label">Músculo trabajado</label>
      <input type="text" id="musculoTrabajo" class="form-control" placeholder="Ej: Piernas">
    </div>

    <div class="mb-3">
      <label for="descripcionEjercicio" class="form-label">Descripción</label>
      <textarea id="descripcionEjercicio" class="form-control" rows="2" placeholder="Describe cómo realizar el ejercicio"></textarea>
    </div>

    <div class="d-grid gap-2 mb-4">
      <button class="btn btn-success" onclick="agregarEjercicio()">Agregar ejercicio</button>
    </div>

    <hr>

    <h5 class="mb-3">Lista de ejercicios agregados</h5>
    <ul id="listaEjercicios" class="list-group">
      <!-- Ejercicios agregados aparecerán aquí -->
    </ul>

  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
